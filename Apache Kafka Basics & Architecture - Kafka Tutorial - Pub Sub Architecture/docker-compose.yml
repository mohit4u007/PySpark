services:
  cf-kafka-1:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"      # EXTERNAL
      - "19092:19092"    # INTERNAL (optional)
      - "19093:19093"    # CONTROLLER
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cf-kafka-1:19093,2@cf-kafka-2:19095,3@cf-kafka-3:19097
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cf-kafka-1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

  cf-kafka-2:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9094:9094"      # EXTERNAL
      - "19094:19094"    # INTERNAL (optional)
      - "19095:19095"    # CONTROLLER
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_BROKER_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cf-kafka-1:19093,2@cf-kafka-2:19095,3@cf-kafka-3:19097
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19094,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:19095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cf-kafka-2:19094,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

  cf-kafka-3:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9096:9096"      # EXTERNAL
      - "19096:19096"    # INTERNAL (optional)
      - "19097:19097"    # CONTROLLER
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_BROKER_ID: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cf-kafka-1:19093,2@cf-kafka-2:19095,3@cf-kafka-3:19097
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19096,EXTERNAL://0.0.0.0:9096,CONTROLLER://0.0.0.0:19097
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cf-kafka-3:19096,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT