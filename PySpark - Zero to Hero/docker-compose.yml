services:
  pyspark-tutorial:
    build:
      context: .
      dockerfile: Dockerfile
    # image: easewithdata/pyspark-jupyter-lab-old
    container_name: pyspark-tutorial-lab
    ports:
        # - 8888:8888
        - 4040:4040
    environment:
        # JUPYTER_PORT: 8888
        SPARK_UI_PORT: 4040
    volumes:
        - spark_data:/data:rw
  spark-master:
    # image: andreper/spark-master:3.5.7
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    volumes:
        - spark_data:/data:rw
  spark-worker-1:
    # image: andreper/spark-worker:3.5.7
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
        - spark_data:/data:rw
  spark-worker-2:
    # image: andreper/spark-worker:3.5.7
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
        - spark_data:/data:rw
  spark-history-server:
      image: rangareddy1988/spark-history-server:3.5.0
      container_name: spark-history-server
      depends_on:
        - spark-master
      ports:
        - "18081:18081"
      volumes:
        - /tmp/spark-events-local:/tmp/spark-events
volumes:
  spark_data: